trigger:
  branches:
    include:
      - main

pool:
  name: self-hosted-linux

variables:
  sshServiceConnection: ubuntu-nginx-ssh
  deployPath: /var/www/html
  nodeVersion: 22.x
  fullName: Javeson Francois Liu

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildApp
        displayName: Install and build
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              node --version
              npm --version
              npm ci --no-audit --no-fund
            displayName: Install dependencies

          - script: npm run build
            displayName: Build the React app
            env:
              CI: 'true'

          - task: PublishPipelineArtifact@1
            displayName: Keep the unverified build for the next stages
            inputs:
              targetPath: $(Build.SourcesDirectory)/build
              artifact: react_build_unverified
              publishLocation: pipeline

  - stage: Test
    displayName: Test
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestApp
        displayName: Run the unit tests
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci --no-audit --no-fund
            displayName: Install dependencies

          - script: npm test -- --watchAll=false
            displayName: Run npm test (a failure blocks the pipeline)
            env:
              CI: 'true'

  - stage: Publish
    displayName: Publish
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: PublishArtifact
        displayName: Publish the tested build
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download the unverified build
            inputs:
              source: current
              artifact: react_build_unverified
              path: $(Pipeline.Workspace)/candidate

          - task: PublishPipelineArtifact@1
            displayName: Publish react_build
            inputs:
              targetPath: $(Pipeline.Workspace)/candidate
              artifact: react_build
              publishLocation: pipeline

  - stage: Deploy
    displayName: Deploy
    dependsOn: Publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployToVm
        displayName: Copy to the VM and restart Nginx
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download react_build
            inputs:
              source: current
              artifact: react_build
              path: $(Pipeline.Workspace)/react_build

          - script: |
              ls -la $(Pipeline.Workspace)/react_build
              grep -rl "$(fullName)" $(Pipeline.Workspace)/react_build/static/js | head -1
            displayName: Pipeline information

          - task: CopyFilesOverSSH@0
            displayName: Copy react_build to $(deployPath)
            inputs:
              sshEndpoint: $(sshServiceConnection)
              sourceFolder: $(Pipeline.Workspace)/react_build
              contents: '**'
              targetFolder: $(deployPath)
              cleanTargetFolder: true
              overwrite: true
              failOnEmptySource: true
              readyTimeout: '20000'

          - task: SSH@0
            displayName: Restart Nginx and verify the deployment
            inputs:
              sshEndpoint: $(sshServiceConnection)
              runOptions: inline
              inline: |
                set -e
                sudo systemctl restart nginx
                echo "Nginx status:"
                systemctl is-active nginx
                echo "Files in $(deployPath):"
                ls -la $(deployPath)
                curl -fsS -o /tmp/react.html -w 'HTTP status from localhost: %{http_code}\n' http://localhost/
                grep -q 'id="root"' /tmp/react.html
                grep -rl "$(fullName)" $(deployPath)/static/js | head -1
                echo "React app is live on this VM"
              failOnStdErr: false
              readyTimeout: '20000'
