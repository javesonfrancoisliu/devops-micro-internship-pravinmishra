server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        return 404;
    }
}
