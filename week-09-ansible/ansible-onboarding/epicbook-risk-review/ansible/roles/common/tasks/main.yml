---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages, MySQL client and Node.js
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present
